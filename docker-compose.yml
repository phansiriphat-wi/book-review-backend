# PostgreSQL ในเครื่องสำหรับพัฒนา (แบบเดียวกับ week6-lab)  ของจริงบน Supabase
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:localdev@localhost:5432/bookreview
# รหัส localdev ใช้กับฐานข้อมูลทิ้งได้ในเครื่องเท่านั้น ห้ามใช้กับ Supabase
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: bookreview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
